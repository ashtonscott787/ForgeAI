# Type-checks and builds the frontend, and runs the Rust core's unit tests.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm build
      - name: Electron main-process syntax
        run: node --check electron/main.cjs && node --check electron/transfer.cjs && node --check electron/updater.cjs && node --check electron/skills.cjs && node --check electron/connectors.cjs
      - name: Unit and integration tests
        run: pnpm test

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p forge-core
      - run: cargo fmt --all -- --check
