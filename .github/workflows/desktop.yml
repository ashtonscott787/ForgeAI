# Builds the Electron desktop app on real macOS and Windows runners.
#
# Nothing here is code-signed: macOS shows "unidentified developer" and Windows
# shows SmartScreen on first launch. Signing needs paid certificates.
#
# UNVERIFIED: this workflow has never completed a run. Treat the first run as
# the test of the workflow itself.
name: Desktop installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish as a release, e.g. 0.4.1. Leave blank to build without releasing."
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release (beta channel)"
        type: boolean
        default: false

env:
  LLAMA_TAG: b12180

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            asset: llama-b12180-bin-macos-arm64.tar.gz
            builder: --mac
          - os: windows-latest
            label: Windows (x64)
            asset: llama-b12180-bin-win-cpu-x64.zip
            builder: --win

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache the inference engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: engine
          key: engine-${{ runner.os }}-${{ env.LLAMA_TAG }}-v2

      # Fast path: the prebuilt release asset. If that is unavailable — the
      # release CDN does return 504s — the engine is built from the same tag
      # instead, so a release never depends on one host being healthy.
      - name: Fetch the inference engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        id: fetch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine _dl
          url="https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/${{ matrix.asset }}"
          curl -sSfL --retry 5 --retry-delay 6 --retry-all-errors --connect-timeout 20 \
            "$url" -o "_dl/${{ matrix.asset }}"
          case "${{ matrix.asset }}" in
            *.tar.gz) tar xzf "_dl/${{ matrix.asset }}" -C _dl ;;
            *.zip)    unzip -q "_dl/${{ matrix.asset }}" -d _dl ;;
          esac
          find _dl -type f \( -name 'llama-server' -o -name 'llama-server.exe' \
            -o -name '*.dylib' -o -name '*.dll' -o -name 'LICENSE*' \) -exec cp {} engine/ \;
          test -f engine/llama-server -o -f engine/llama-server.exe

      - name: Build the inference engine from source
        if: steps.engine-cache.outputs.cache-hit != 'true' && steps.fetch.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf engine && mkdir -p engine
          git clone --depth 1 --branch "${LLAMA_TAG}" https://github.com/ggml-org/llama.cpp _src
          EXTRA=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            EXTRA="-DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DCMAKE_OSX_ARCHITECTURES=arm64"
          fi
          cmake -S _src -B _b -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_RPC=ON -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON $EXTRA
          cmake --build _b --config Release --target llama-server
          find _b -type f \( -name 'llama-server' -o -name 'llama-server.exe' \) -exec cp {} engine/ \;
          cp _src/LICENSE engine/LICENSE-llama.cpp || true
          test -f engine/llama-server -o -f engine/llama-server.exe

      - name: Check the engine is present
        shell: bash
        run: |
          set -euo pipefail
          test -f engine/llama-server -o -f engine/llama-server.exe
          chmod +x engine/llama-server 2>/dev/null || true
          ls -l engine

      - name: Make the macOS engine loadable
        if: runner.os == 'macOS'
        shell: bash
        run: node scripts/engine-links.cjs engine
      - name: Cache the Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-38.0.0

      # Electron's postinstall pulls its binary from the same release host that
      # has been intermittently returning 504, so one refusal must not sink the
      # build. The cache above means a success is reused next time.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            echo "attempt $attempt failed; waiting before retry"
            sleep 25
          done
          echo "dependencies could not be installed after four attempts"
          exit 1

      - run: pnpm build

      - name: Cache electron-builder's own tools
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron-builder\Cache
          key: ebtools-${{ runner.os }}-25.1.8

      # electron-builder fetches NSIS and its signing tools at build time and
      # does not retry, so one 504 from that host loses the whole run.
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          for attempt in 1 2 3 4; do
            if pnpm exec electron-builder ${{ matrix.builder }} --publish never; then exit 0; fi
            echo "packaging attempt $attempt failed; waiting before retry"
            sleep 30
          done
          echo "packaging failed after four attempts"
          exit 1

      # Apple Silicon refuses to launch a Mach-O with no signature at all, and
      # reports it as "damaged" rather than unsigned. electron-builder skips
      # signing when there is no certificate, so the bundle is ad-hoc signed
      # here and the archives are rebuilt from the signed copy. This is not
      # notarization: Gatekeeper still warns once, and right-click → Open still
      # applies. It is the difference between a warning and a dead app.
      - name: Check the packaged engine can load (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/engine-links.cjs --check "$(ls -d release/mac*/Forge\ AI.app)/Contents/Resources/engine"
      - name: Ad-hoc sign and repackage (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find release -maxdepth 3 -name "Forge AI.app" -type d | head -1)
          [ -n "$APP" ] || { echo "no .app was produced"; exit 1; }
          xattr -cr "$APP"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          rm -f release/Forge-AI-macOS-arm64.zip release/Forge-AI-macOS-arm64.dmg
          ditto -c -k --sequesterRsrc --keepParent "$APP" release/Forge-AI-macOS-arm64.zip
          hdiutil create -volname "Forge AI" -srcfolder "$APP" -ov -format UDZO release/Forge-AI-macOS-arm64.dmg
          ls -lh release

      # Every check below runs AFTER signing and repackaging, on the exact bytes that would be
      # downloaded: the signed app, the released zip, and a copy installed into /Applications.
      - name: Verify every engine library in the signed app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find release -maxdepth 3 -name "Forge AI.app" -type d | head -1)
          node scripts/engine-links.cjs --check "$APP/Contents/Resources/engine"
          codesign --verify --deep --strict "$APP"

      - name: Verify the released zip contains a loadable engine
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/zipcheck" && mkdir -p "$RUNNER_TEMP/zipcheck"
          ditto -x -k release/Forge-AI-macOS-arm64.zip "$RUNNER_TEMP/zipcheck"
          node scripts/engine-links.cjs --check "$RUNNER_TEMP/zipcheck/Forge AI.app/Contents/Resources/engine"
          "$RUNNER_TEMP/zipcheck/Forge AI.app/Contents/Resources/engine/llama-server" --version

      # Installed the way a user would: copied out of the download into Applications, then run from there.
      - name: Install the app into Applications (test install)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf "/Applications/Forge AI.app"
          sudo ditto "$RUNNER_TEMP/zipcheck/Forge AI.app" "/Applications/Forge AI.app"
          codesign --verify --deep --strict "/Applications/Forge AI.app"
          node scripts/engine-links.cjs --check "/Applications/Forge AI.app/Contents/Resources/engine"

      - name: Download the test models (SmolVLM 256M, Gemma 2 2B Q4_K_M)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/smolvlm.gguf" \
            "https://huggingface.co/ggml-org/SmolVLM-256M-Instruct-GGUF/resolve/main/SmolVLM-256M-Instruct-Q8_0.gguf?download=true"
          curl -sSfL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/gemma.gguf" \
            "https://huggingface.co/bartowski/gemma-2-2b-it-GGUF/resolve/main/gemma-2-2b-it-Q4_K_M.gguf?download=true"
          test "$(stat -f %z "$RUNNER_TEMP/gemma.gguf")" = "1708582752"

      - name: "Smoke test: the installed engine loads and generates (SmolVLM)"
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/smoke-engine.sh "/Applications/Forge AI.app/Contents/Resources/engine" "$RUNNER_TEMP/smolvlm.gguf" 18765

      - name: "Smoke test: the installed engine loads and generates (Gemma 2 2B Q4_K_M)"
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/smoke-engine.sh "/Applications/Forge AI.app/Contents/Resources/engine" "$RUNNER_TEMP/gemma.gguf" 18766

      - uses: actions/upload-artifact@v4
        with:
          name: forge-ai-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
          retention-days: 30

  # One checksum file covering every platform, written after both builds finish.
  # Splitting it per job would leave each upload overwriting the other's, and an
  # asset with no checksum is one the updater refuses to install.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: forge-ai-*
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt
          files=$(ls *.dmg *.zip *.exe 2>/dev/null || true)
          [ -n "$files" ] || { echo "no installers were produced"; exit 1; }
          sha256sum $files > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          name: ${{ inputs.version != '' && format('Forge AI {0}', inputs.version) || format('Forge AI {0}', github.ref_name) }}
          draft: false
          prerelease: ${{ inputs.prerelease == true }}
          fail_on_unmatched_files: false
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
