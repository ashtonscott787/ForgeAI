# Builds the Electron desktop app on real macOS and Windows runners.
#
# Nothing here is code-signed: macOS shows "unidentified developer" and Windows
# shows SmartScreen on first launch. Signing needs paid certificates.
#
# UNVERIFIED: this workflow has never completed a run. Treat the first run as
# the test of the workflow itself.
name: Desktop installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish as a release, e.g. 0.4.1. Leave blank to build without releasing."
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release (beta channel)"
        type: boolean
        default: false

env:
  LLAMA_TAG: b12180

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            asset: llama-b12180-bin-macos-arm64.tar.gz
            enginePlatform: darwin-arm64
            builder: --mac
          - os: windows-latest
            label: Windows (x64)
            asset: llama-b12180-bin-win-cpu-x64.zip
            enginePlatform: win32-x64
            builder: --win

    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: package.json pins packageManager, and
      # this action refuses to run when it is told a version as well. CI and a
      # developer's machine therefore use exactly the same pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The key carries what the engine folder is supposed to contain, not
      # only the llama.cpp tag. With the tag alone, adding three binaries to
      # the manifest left the key unchanged, the cache hit, and the previous
      # folder — holding llama-server and nothing else — was restored into a
      # release that claimed to ship them. 0.7.0 went out that way.
      - name: Work out the engine signature
        id: engine-sig
        shell: bash
        run: echo "sig=$(node -e "process.stdout.write(require('./scripts/engine-manifest.cjs').signature())")" >> "$GITHUB_OUTPUT"
      - name: Cache the inference engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: engine
          key: engine-${{ runner.os }}-${{ env.LLAMA_TAG }}-${{ steps.engine-sig.outputs.sig }}

      # Fast path: the prebuilt release asset. If that is unavailable — the
      # release CDN does return 504s — the engine is built from the same tag
      # instead, so a release never depends on one host being healthy.
      # One code path, here and on a developer's machine. This step used to
      # have its own curl and its own `find -name llama-server`, so the
      # script's list of binaries had no effect on what was released.
      - name: Fetch the inference engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        id: fetch
        continue-on-error: true
        shell: bash
        env:
          FORGE_ENGINE_PLATFORM: ${{ matrix.enginePlatform }}
        run: node scripts/get-engine.cjs --force

      - name: Build the inference engine from source
        if: steps.engine-cache.outputs.cache-hit != 'true' && steps.fetch.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf engine && mkdir -p engine
          git clone --depth 1 --branch "${LLAMA_TAG}" https://github.com/ggml-org/llama.cpp _src
          EXTRA=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            EXTRA="-DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DCMAKE_OSX_ARCHITECTURES=arm64"
          fi
          cmake -S _src -B _b -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_RPC=ON -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON $EXTRA
          # Every tool the app runs, not just the server. Building only
          # llama-server here would mean a fallback build quietly shipping
          # without clustering or the model workshop, and nothing would say so
          # until somebody pressed the button.
          cmake --build _b --config Release --target llama-server rpc-server llama-quantize llama-export-lora
          find _b -type f \( -name 'llama-server' -o -name 'llama-server.exe' \
            -o -name 'ggml-rpc-server' -o -name 'ggml-rpc-server.exe' \
            -o -name 'rpc-server' -o -name 'rpc-server.exe' \
            -o -name 'llama-quantize' -o -name 'llama-quantize.exe' \
            -o -name 'llama-export-lora' -o -name 'llama-export-lora.exe' \) -exec cp {} engine/ \;
          # Older trees name it rpc-server; the app looks for ggml-rpc-server.
          if [ -f engine/rpc-server ] && [ ! -f engine/ggml-rpc-server ]; then mv engine/rpc-server engine/ggml-rpc-server; fi
          if [ -f engine/rpc-server.exe ] && [ ! -f engine/ggml-rpc-server.exe ]; then mv engine/rpc-server.exe engine/ggml-rpc-server.exe; fi
          cp _src/LICENSE engine/LICENSE-llama.cpp || true
          test -f engine/llama-server -o -f engine/llama-server.exe

      - name: Check the engine is present
        shell: bash
        run: |
          set -euo pipefail
          test -f engine/llama-server -o -f engine/llama-server.exe
          for t in llama-server ggml-rpc-server llama-quantize llama-export-lora; do
            if [ -f "engine/$t" ] || [ -f "engine/$t.exe" ]; then
              chmod +x "engine/$t" 2>/dev/null || true
              echo "have $t"
            else
              # Not fatal: the app checks for each at runtime and says the
              # feature is missing rather than failing when it is used. It is
              # printed so a build that quietly lost one is visible here.
              echo "MISSING $t — the feature that uses it will be unavailable in this build"
            fi
          done
          ls -l engine

      - name: Make the macOS engine loadable
        if: runner.os == 'macOS'
        shell: bash
        run: node scripts/engine-links.cjs engine
      - name: Cache the Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-45.4.1

      # Electron's postinstall pulls its binary from the same release host that
      # has been intermittently returning 504, so one refusal must not sink the
      # build. The cache above means a success is reused next time.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            echo "attempt $attempt failed; waiting before retry"
            sleep 25
          done
          echo "dependencies could not be installed after four attempts"
          exit 1

      - run: pnpm build

      - name: Cache electron-builder's own tools
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron-builder\Cache
          key: ebtools-${{ runner.os }}-25.1.8

      # electron-builder fetches NSIS and its signing tools at build time and
      # does not retry, so one 504 from that host loses the whole run.
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          # The guard, before the packager. `pnpm dist` runs it; this step
          # called electron-builder directly and so never did, which is why
          # a Windows build packaged happily with an engine tool missing and
          # said nothing. A guard that only runs on a developer's machine is
          # not a guard.
          node scripts/check-engine.cjs
          for attempt in 1 2 3 4; do
            if pnpm exec electron-builder ${{ matrix.builder }} --publish never; then exit 0; fi
            echo "packaging attempt $attempt failed; waiting before retry"
            sleep 30
          done
          echo "packaging failed after four attempts"
          exit 1

      # Apple Silicon refuses to launch a Mach-O with no signature at all, and
      # reports it as "damaged" rather than unsigned. electron-builder skips
      # signing when there is no certificate, so the bundle is ad-hoc signed
      # here and the archives are rebuilt from the signed copy. This is not
      # notarization: Gatekeeper still warns once, and right-click → Open still
      # applies. It is the difference between a warning and a dead app.
      - name: Check the packaged engine can load (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/engine-links.cjs --check "$(ls -d release/mac*/Forge\ AI.app)/Contents/Resources/engine"
      # Signing, and why it matters beyond the Gatekeeper warning.
      #
      # An ad-hoc signature ("--sign -") has no identity of its own: macOS
      # identifies the program by the hash of its own contents, which changes
      # with every single build. So every update looks to macOS like a
      # different program wearing the same name, and the entries it keeps per
      # program — Login Items, the firewall's incoming-connections list,
      # Privacy permissions — gain another "Forge AI Helper" each time instead
      # of replacing the last one. Nothing in the app can clear those; only a
      # stable signing identity stops them accumulating.
      #
      # A Developer ID certificate is that stable identity. When the four
      # secrets below are set the app is signed with it and notarized, updates
      # replace their predecessor's entries, and the warning goes away. With
      # no certificate the build still works and is still ad-hoc signed —
      # Apple Silicon will not launch an unsigned binary at all — and the log
      # says plainly which of the two happened.
      - name: Sign and repackage (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP=$(find release -maxdepth 3 -name "Forge AI.app" -type d | head -1)
          [ -n "$APP" ] || { echo "no .app was produced"; exit 1; }
          xattr -cr "$APP"

          if [ -n "${MAC_CERT_P12:-}" ] && [ -n "${MAC_CERT_PASSWORD:-}" ]; then
            echo "Signing with a Developer ID certificate."
            KEYCHAIN="$RUNNER_TEMP/forge-signing.keychain-db"
            KEYCHAIN_PASSWORD=$(uuidgen)
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/cert.p12"

            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')
            [ -n "$IDENTITY" ] || { echo "the certificate holds no Developer ID Application identity"; exit 1; }

            # Inside out: every nested binary before the bundle that contains
            # it, because signing a bundle does not re-sign what is already
            # sealed inside it. --deep is not a substitute and Apple says so.
            find "$APP/Contents/Resources/engine" -type f \( -perm -u+x -o -name "*.dylib" \) -print0 2>/dev/null |
              while IFS= read -r -d "" f; do
                codesign --force --timestamp --options runtime --sign "$IDENTITY" "$f"
              done
            find "$APP/Contents/Frameworks" -maxdepth 1 -name "*.app" -print0 |
              while IFS= read -r -d "" h; do
                codesign --force --timestamp --options runtime --sign "$IDENTITY" "$h"
              done
            codesign --force --timestamp --options runtime --entitlements build/entitlements.mac.plist --sign "$IDENTITY" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            SIGNED_WITH="Developer ID"
          else
            echo "No MAC_CERT_P12 secret is set, so this build is ad-hoc signed."
            echo "Gatekeeper will warn, and each update will add another set of"
            echo "Forge AI Helper entries to Login Items and the firewall list."
            codesign --force --deep --sign - --timestamp=none "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            SIGNED_WITH="ad-hoc"
          fi

          rm -f release/Forge-AI-macOS-arm64.zip release/Forge-AI-macOS-arm64.dmg
          ditto -c -k --sequesterRsrc --keepParent "$APP" release/Forge-AI-macOS-arm64.zip
          hdiutil create -volname "Forge AI" -srcfolder "$APP" -ov -format UDZO release/Forge-AI-macOS-arm64.dmg

          if [ "$SIGNED_WITH" = "Developer ID" ] && [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "Notarizing. This waits for Apple and can take several minutes."
            xcrun notarytool submit release/Forge-AI-macOS-arm64.dmg \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple release/Forge-AI-macOS-arm64.dmg
            # The zip is re-made from the stapled app so both downloads carry
            # the ticket; a stapled dmg and an unstapled zip is a trap.
            xcrun notarytool submit release/Forge-AI-macOS-arm64.zip \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$APP"
            rm -f release/Forge-AI-macOS-arm64.zip
            ditto -c -k --sequesterRsrc --keepParent "$APP" release/Forge-AI-macOS-arm64.zip
            echo "Signed with a Developer ID and notarized."
          else
            echo "Signed $SIGNED_WITH, not notarized."
          fi
          ls -lh release

      # Every check below runs AFTER signing and repackaging, on the exact bytes that would be
      # downloaded: the signed app, the released zip, and a copy installed into /Applications.
      - name: Verify every engine library in the signed app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find release -maxdepth 3 -name "Forge AI.app" -type d | head -1)
          node scripts/engine-links.cjs --check "$APP/Contents/Resources/engine"
          codesign --verify --deep --strict "$APP"

      - name: Verify the released zip contains a loadable engine
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/zipcheck" && mkdir -p "$RUNNER_TEMP/zipcheck"
          ditto -x -k release/Forge-AI-macOS-arm64.zip "$RUNNER_TEMP/zipcheck"
          node scripts/engine-links.cjs --check "$RUNNER_TEMP/zipcheck/Forge AI.app/Contents/Resources/engine"
          "$RUNNER_TEMP/zipcheck/Forge AI.app/Contents/Resources/engine/llama-server" --version

      # The dmg is published too, and hdiutil builds it separately from the zip,
      # so it gets the same check rather than being assumed good.
      - name: Verify the released dmg contains a loadable engine
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          MP="$RUNNER_TEMP/dmgcheck"
          rm -rf "$MP" && mkdir -p "$MP"
          hdiutil attach release/Forge-AI-macOS-arm64.dmg -mountpoint "$MP" -nobrowse -readonly
          trap 'hdiutil detach "$MP" -quiet || true' EXIT
          node scripts/engine-links.cjs --check "$MP/Forge AI.app/Contents/Resources/engine"
          codesign --verify --deep --strict "$MP/Forge AI.app"

      # Installed the way a user would: copied out of the download into Applications, then run from there.
      - name: Install the app into Applications (test install)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf "/Applications/Forge AI.app"
          sudo ditto "$RUNNER_TEMP/zipcheck/Forge AI.app" "/Applications/Forge AI.app"
          codesign --verify --deep --strict "/Applications/Forge AI.app"
          node scripts/engine-links.cjs --check "/Applications/Forge AI.app/Contents/Resources/engine"

      - name: Download the test models (SmolVLM 256M, Gemma 2 2B Q4_K_M)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/smolvlm.gguf" \
            "https://huggingface.co/ggml-org/SmolVLM-256M-Instruct-GGUF/resolve/main/SmolVLM-256M-Instruct-Q8_0.gguf?download=true"
          curl -sSfL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/gemma.gguf" \
            "https://huggingface.co/bartowski/gemma-2-2b-it-GGUF/resolve/main/gemma-2-2b-it-Q4_K_M.gguf?download=true"
          test "$(stat -f %z "$RUNNER_TEMP/gemma.gguf")" = "1708582752"

      - name: "Smoke test: the installed engine loads and generates (SmolVLM)"
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/smoke-engine.sh "/Applications/Forge AI.app/Contents/Resources/engine" "$RUNNER_TEMP/smolvlm.gguf" 18765

      - name: "Smoke test: the installed engine loads and generates (Gemma 2 2B Q4_K_M)"
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/smoke-engine.sh "/Applications/Forge AI.app/Contents/Resources/engine" "$RUNNER_TEMP/gemma.gguf" 18766

      # PDF generation needs Electron, which the development environment does
      # not have, so it has never been run there. The macOS runner does have
      # it: this renders a document, writes it, reopens it with pdf.js and
      # checks the passages come back, and fails the build if they do not.
      # 0.5.5 shipped an app that could not open: a module was used at load time
      # and declared later, so the main process threw before any window
      # appeared. Every check here passed, because none of them had ever
      # started the app. This one does.
      - name: "Launch the installed app and check it stays up"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          BIN="/Applications/Forge AI.app/Contents/MacOS/Forge AI"
          test -x "$BIN" || { echo "no executable in the installed app"; exit 1; }
          "$BIN" > "$RUNNER_TEMP/launch.log" 2>&1 &
          PID=$!
          sleep 25
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "The app exited on its own. Its output:"
            cat "$RUNNER_TEMP/launch.log"
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          if grep -qiE "Uncaught Exception|ReferenceError|TypeError: .* is not a function|Cannot access" "$RUNNER_TEMP/launch.log"; then
            echo "The app started but reported a fatal error:"
            cat "$RUNNER_TEMP/launch.log"
            exit 1
          fi
          echo "The app launched and stayed up for 25 seconds."
          cat "$RUNNER_TEMP/launch.log" || true

      - name: "Verify PDF generation really works"
        if: runner.os == 'macOS'
        # Blocking: a regression here should stop a release rather than be
        # noted in a log nobody reads. This step is macOS-only and macOS has a
        # display, so Electron runs directly. It used to be wrapped in
        # xvfb-run, which does not exist on the runner: the wrapper always
        # failed with "command not found" and the fallback after `||` did the
        # real work, which also gave a genuine failure a free second attempt.
        shell: bash
        run: pnpm exec electron scripts/verify-pdf.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: forge-ai-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
          retention-days: 30

  # One checksum file covering every platform, written after both builds finish.
  # Splitting it per job would leave each upload overwriting the other's, and an
  # asset with no checksum is one the updater refuses to install.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: forge-ai-*
          merge-multiple: true

      # Release safeguard. v0.5.2 shipped a macOS engine with 104 missing library
      # links because the release ran from a branch that lacked the link check.
      # Nothing that is about to be uploaded is trusted on the build's word alone:
      # the exact zip is unpacked here and must pass the same check the build uses.
      - name: Refuse to publish a macOS build whose engine cannot load
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/Forge-AI-macOS-arm64.zip || { echo "no macOS zip to publish"; exit 1; }
          rm -rf "$RUNNER_TEMP/publish-check" && mkdir -p "$RUNNER_TEMP/publish-check"
          unzip -q dist/Forge-AI-macOS-arm64.zip -d "$RUNNER_TEMP/publish-check"
          node scripts/engine-links.cjs --check "$RUNNER_TEMP/publish-check/Forge AI.app/Contents/Resources/engine"
          echo "macOS engine libraries verified in the exact zip being published"

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt
          files=$(ls *.dmg *.zip *.exe 2>/dev/null || true)
          [ -n "$files" ] || { echo "no installers were produced"; exit 1; }
          sha256sum $files > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          name: ${{ inputs.version != '' && format('Forge AI {0}', inputs.version) || format('Forge AI {0}', github.ref_name) }}
          draft: false
          prerelease: ${{ inputs.prerelease == true }}
          fail_on_unmatched_files: false
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
